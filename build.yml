name: Build porotos-core

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: Android32
            os: ubuntu-latest
            target: Android32
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: porotos-core
          path: ${{ steps.build.outputs.build-output }}
      - name: Adjuntar el mod al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ${{ steps.build.outputs.build-output }}/*.geode --clobber --repo "${{ github.repository }}"

  launcher:
    name: Launcher (Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: launcher/go.sum
      - name: Tests
        working-directory: launcher
        run: go test ./...
      - name: Compilar
        working-directory: launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.Version=$VERSION" -o Porotos2Launcher.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Porotos2Launcher
          path: launcher/Porotos2Launcher.exe
      - name: Adjuntar el launcher al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" launcher/Porotos2Launcher.exe --clobber --repo "${{ github.repository }}"
